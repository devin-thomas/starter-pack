name: Style guide audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/style-guide-audit.yml'
      - 'content/style/**'
      - 'scripts/style-guide*'
      - 'src/App.tsx'
      - 'scripts/content.ts'
      - 'scripts/verify-deployment.ts'

permissions:
  contents: read

concurrency:
  group: style-guide-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Record source revision
        run: git rev-parse HEAD > audit-source-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: style-guide-audit-source
          path: |
            src/
            scripts/
            content/
            public/
            package.json
            package-lock.json
            tsconfig.json
            index.html
            vite.config.ts
            wrangler.jsonc
            README.md
            LICENSE
            audit-source-revision.txt
          retention-days: 7
          if-no-files-found: error
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: style-guide-audit-build
          path: |
            dist/
            audit-source-revision.txt
          retention-days: 7
          if-no-files-found: error
