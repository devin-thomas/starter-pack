name: Record verified TypeScript release content

on:
  push:
    branches: [audit/typescript-1.0]
    paths: ['.github/workflows/style-guide-audit-prepare.yml']

permissions:
  contents: write

jobs:
  record:
    if: github.ref == 'refs/heads/audit/typescript-1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/typescript-1.0
      - name: Verify exact source and tested release body
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('content/style/typescript.md');raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='5976e3c0460afcd72c311b87cc6c72264c5ffb744bd7a12225ca9337c5779379'
          s=raw.decode().replace('version: 0.1.14','version: 1.0.0',1).replace('status: in-progress','status: stable',1)
          s,n=re.subn(r'^> \*\*In progress\.\*\*[^\n]*\n\n','',s,count=1,flags=re.M)
          assert n==1
          body=s.split('---',2)[2].lstrip()
          assert hashlib.sha256(body.encode()).hexdigest()=='86de2abe54511b7f851d2452bd01819e143e41e2f5f9d46dd092a293ffeab8c2'
          p.write_text(s)
          print('Exact release body matches the compiler, runtime and browser-tested artifact from run 35939759982.')
          PY
      - name: Commit only the guide content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/style/typescript.md
          git commit -m 'Record verified TypeScript style guide 1.0.0 content'
          git push origin HEAD:refs/heads/audit/typescript-1.0
